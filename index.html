<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Asad | Developer Portfolio</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="bg-slate-950 text-white">

    <!-- Navigation -->
    <nav class="flex justify-between items-center p-6">

        <h1 class="text-2xl font-bold text-blue-500">
            Asad.dev
        </h1>

        <div class="space-x-5 hidden md:block">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
            <a href="#projects">Projects</a>
        </div>

    </nav>

    <!-- Hero Section -->
    <section id="home" class="text-center py-24 px-6">

        <h1 class="text-5xl font-bold mb-4">
            Hello, I'm Asad
        </h1>

        <h2 class="text-blue-500 text-2xl mb-6">
            Aspiring Full-Stack Developer
        </h2>

        <p class="text-gray-400 max-w-xl mx-auto">
            I enjoy building websites and solving real-world problems
            through technology.
        </p>

    </section>

    <!-- About Section -->
    <section id="about" class="text-center py-16 px-6">

        <h2 class="text-3xl font-bold mb-6">About Me</h2>

        <p id="about-text" class="text-gray-400 max-w-2xl mx-auto"></p>

    </section>

    <!-- Skills Section -->
    <section id="skills" class="text-center py-16 bg-slate-900">

        <h2 class="text-3xl font-bold mb-8">My Skills</h2>

        <div id="skills-container"
            class="flex flex-wrap justify-center gap-4">
        </div>

    </section>

    <!-- Projects Section -->
    <section id="projects" class="text-center py-16 px-6">

        <h2 class="text-3xl font-bold mb-8">My Projects</h2>

        <div id="projects-container"
            class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl mx-auto">
        </div>

    </section>

    <!-- Footer -->
    <footer class="text-center p-8 bg-slate-900">

        <p class="text-gray-400">
            © 2026 Asad. All Rights Reserved.
        </p>

    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
